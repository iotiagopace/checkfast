<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS
══════════════════════════════════════════════ */
:root {
  --brand-yellow:       #F5A623;
  --brand-yellow-hover: #E09000;
  --brand-yellow-light: #FFF8E7;
  --brand-yellow-muted: #FFF3D6;
  --brand-black:        #1A1A1A;
  --brand-dark-gray:    #2D2D2D;
  --neutral-white:      #FFFFFF;
  --neutral-light:      #F5F5F5;
  --neutral-med:        #4A4A4A;
  --neutral-border:     #EEEEEE;
  --text-on-dark:           rgba(255,255,255,0.85);
  --text-on-dark-secondary: rgba(255,255,255,0.70);
  --text-on-dark-muted:     rgba(255,255,255,0.50);
  --text-on-dark-faint:     rgba(255,255,255,0.35);
  --yellow-glass:       rgba(245,166,35,0.12);
  --yellow-border:      rgba(245,166,35,0.20);
  --yellow-glow:        rgba(245,166,35,0.08);
  --gradient-hero:         linear-gradient(135deg,#1A1A1A 0%,#0d0d0d 100%);
  --gradient-dark-section: linear-gradient(135deg,#1A1A1A 0%,#0d0d0d 50%,#2D2D2D 100%);
  --font-display: 'Poppins', sans-serif;
  --font-body:    'Poppins', sans-serif;
  --text-hero:       clamp(1.9rem,3.8vw,2.9rem);
  --text-section:    clamp(1.5rem,3.2vw,2.1rem);
  --text-metric:     clamp(1.4rem,2.8vw,2rem);
  --text-metric-lg:  clamp(2.2rem,4.5vw,3.2rem);
  --lh-headline: 1.15;
  --lh-impact:   1.20;
  --lh-body-lg:  1.65;
  --ls-headline: -0.02em;
  --ls-badge:     0.04em;
  --shadow-card:            0 2px 8px rgba(0,0,0,0.06);
  --shadow-card-hover:      0 12px 32px rgba(0,0,0,0.12);
  --shadow-card-dark:       0 2px 8px rgba(0,0,0,0.20);
  --shadow-card-dark-hover: 0 12px 32px rgba(0,0,0,0.40);
  --shadow-button:          0 4px 16px rgba(245,166,35,0.30);
  --radius-card:   12px;
  --radius-button: 8px;
  --radius-input:  8px;
  --radius-badge:  100px;
  --radius-lg:     16px;
  --dur-fast:   0.25s;
  --dur-normal: 0.30s;
  --dur-slow:   0.45s;
}

/* ══════════════════════════════════════════════
   RESET + BASE
══════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { background:var(--brand-black); font-family:var(--font-body); color:var(--neutral-white); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
input,select,button { font-family:inherit; outline:none; }
input::placeholder { color:rgba(255,255,255,0.45); }
select option { background:var(--brand-black); color:#fff; }
::selection { background:var(--brand-yellow); color:var(--brand-black); }

/* ══════════════════════════════════════════════
   ANIMATIONS
══════════════════════════════════════════════ */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(28px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
@keyframes pulse-glow {
  0%,100% { opacity:.06; transform:scale(1); }
  50%      { opacity:.12; transform:scale(1.05); }
}
@keyframes shimmer {
  0%   { background-position:200% center; }
  100% { background-position:-200% center; }
}

/* Scroll-reveal */
.reveal {
  opacity:0;
  transform:translateY(24px);
  transition:opacity .65s ease, transform .65s ease;
}
.reveal.visible {
  opacity:1;
  transform:translateY(0);
}
.reveal-delay-1 { transition-delay:.1s; }
.reveal-delay-2 { transition-delay:.2s; }
.reveal-delay-3 { transition-delay:.3s; }
.reveal-delay-4 { transition-delay:.4s; }

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
.wrap { max-width:1160px; margin:0 auto; padding:0 24px; }

/* ══════════════════════════════════════════════
   NAVBAR
══════════════════════════════════════════════ */
.navbar {
  position:fixed;
  top:0; left:0; right:0;
  z-index:100;
  transition:background var(--dur-normal) ease,
             backdrop-filter var(--dur-normal) ease,
             border-color var(--dur-normal) ease,
             box-shadow var(--dur-normal) ease;
  border-bottom:1px solid transparent;
}
.navbar.scrolled {
  background:rgba(15,15,15,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border-bottom-color:rgba(245,166,35,0.15);
  box-shadow:0 4px 24px rgba(0,0,0,0.3);
}
.navbar-inner {
  max-width:1160px;
  margin:0 auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}
.logo {
  font-family:var(--font-display);
  font-size:20px;
  font-weight:900;
  color:var(--neutral-white);
  text-transform:uppercase;
  letter-spacing:0.02em;
  cursor:pointer;
}
.logo span { color:var(--brand-yellow); }

/* ══════════════════════════════════════════════
   CTA BUTTON
══════════════════════════════════════════════ */
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px 32px;
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  border-radius:var(--radius-button);
  border:2px solid transparent;
  cursor:pointer;
  min-height:48px;
  transition:background var(--dur-fast) ease,
             color var(--dur-fast) ease,
             border-color var(--dur-fast) ease,
             transform 0.1s ease,
             box-shadow var(--dur-fast) ease;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
}
.btn:active { transform:scale(0.97); }
.btn:focus-visible { outline:2px solid var(--brand-yellow); outline-offset:3px; }

.btn-primary {
  background:var(--brand-yellow);
  color:var(--brand-black);
  border-color:var(--brand-yellow);
  box-shadow:var(--shadow-button);
}
.btn-primary:hover {
  background:var(--brand-yellow-hover);
  border-color:var(--brand-yellow-hover);
  box-shadow:0 6px 24px rgba(245,166,35,0.45);
  transform:translateY(-1px);
}
.btn-secondary {
  background:transparent;
  color:var(--brand-yellow);
  border-color:var(--brand-yellow);
}
.btn-secondary:hover {
  background:var(--brand-yellow);
  color:var(--brand-black);
  box-shadow:var(--shadow-button);
}
.btn-inverted {
  background:var(--brand-black);
  color:var(--brand-yellow);
  border-color:var(--brand-black);
}
.btn-sm { padding:9px 20px; font-size:13px; min-height:38px; }
.btn-full { width:100%; }
.btn-whatsapp {
  background:#25D366;
  color:#fff;
  border-color:#25D366;
  box-shadow:0 4px 16px rgba(37,211,102,0.3);
}
.btn-whatsapp:hover {
  background:#1ebe5d;
  border-color:#1ebe5d;
  transform:translateY(-1px);
}

/* ══════════════════════════════════════════════
   HERO
══════════════════════════════════════════════ */
.hero {
  min-height:100vh;
  padding:120px 24px 80px;
  position:relative;
  overflow:hidden;
  background-color:var(--brand-black);

  /* Imagem cobre o hero inteiro — overlay escuro uniforme + mais pesado à esquerda p/ leitura */
  background-image:
    linear-gradient(
      to right,
      rgba(10,10,10,0.88) 0%,
      rgba(10,10,10,0.80) 35%,
      rgba(10,10,10,0.55) 60%,
      rgba(10,10,10,0.38) 100%
    ),
    url('assets/hero-bg.jpg');
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
}
/* Glow sutil no canto inferior esquerdo — complementa a foto */
.hero-glow {
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  animation:pulse-glow 7s ease-in-out infinite;
}
.hero-glow-1 {
  width:500px; height:500px;
  bottom:-120px; left:-80px;
  background:radial-gradient(ellipse at center, rgba(245,166,35,0.08) 0%, transparent 65%);
}
.hero-glow-2 { display:none; }
.hero-glow-3 { display:none; }
.hero-grid {
  max-width:1160px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 400px;
  gap:48px;
  align-items:center;
  position:relative;
  z-index:1;
}
.hero-badge {
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--yellow-glass);
  border:1px solid var(--yellow-border);
  border-radius:var(--radius-badge);
  padding:6px 16px;
  margin-bottom:22px;
}
.hero-badge span {
  font-family:var(--font-display);
  font-size:12px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--brand-yellow);
}
.hero-badge-dot {
  width:6px; height:6px;
  border-radius:50%;
  background:var(--brand-yellow);
  animation:pulse-glow 2s infinite;
}
.hero-h1 {
  font-family:var(--font-display);
  font-size:var(--text-hero);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:-0.02em;
  line-height:1.18;
  color:var(--neutral-white);
  margin-bottom:20px;
}
.hero-h1 .accent { color:var(--brand-yellow); }
.hero-p {
  font-size:17px;
  color:var(--text-on-dark-secondary);
  line-height:var(--lh-body-lg);
  margin-bottom:28px;
  max-width:500px;
}
.hero-bullets { display:flex; flex-direction:column; gap:12px; margin-bottom:36px; }
.check-bullet { display:flex; align-items:center; gap:10px; }
.check-circle {
  width:22px; height:22px;
  border-radius:50%;
  background:var(--brand-yellow);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--brand-black);
  flex-shrink:0;
}
.check-text { font-size:15px; font-weight:500; color:var(--text-on-dark); }

/* Form card */
.form-card {
  background:rgba(12,12,12,0.75);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(245,166,35,0.28);
  border-radius:var(--radius-lg);
  padding:30px;
  box-shadow:0 12px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
}
.form-card h2 {
  font-family:var(--font-display);
  font-size:20px; font-weight:800;
  text-transform:uppercase;
  color:var(--neutral-white);
  letter-spacing:-0.01em;
  margin-bottom:4px;
}
.form-card .form-sub {
  font-size:12px; color:var(--text-on-dark-muted);
  margin-bottom:20px;
}
.form-stack { display:flex; flex-direction:column; gap:12px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-label {
  display:block; font-size:11px; color:var(--text-on-dark-muted);
  text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px;
}
.form-input {
  width:100%; padding:12px 14px; font-size:15px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:var(--radius-input); color:#fff;
  transition:border-color var(--dur-fast) ease, background var(--dur-fast) ease;
}
.form-input:focus {
  border-color:var(--brand-yellow);
  background:rgba(255,255,255,0.10);
}
.form-disclaimer {
  font-size:11px; color:var(--text-on-dark-faint);
  text-align:center; margin-top:4px;
}
.submitted-wrap { text-align:center; padding:28px 0; }
.submitted-wrap .icon { font-size:48px; margin-bottom:16px; }
.submitted-wrap h3 {
  font-family:var(--font-display); font-size:24px; font-weight:800;
  text-transform:uppercase; color:var(--brand-yellow); margin-bottom:12px;
}
.submitted-wrap p { font-size:15px; color:var(--text-on-dark-secondary); line-height:1.6; }

/* ══════════════════════════════════════════════
   TRUST BAR
══════════════════════════════════════════════ */
.trust-bar {
  background:#0d0d0d;
  border-top:1px solid rgba(245,166,35,0.25);
  border-bottom:1px solid rgba(245,166,35,0.25);
  padding:0 24px;
  overflow:hidden;
}
.trust-bar-inner {
  max-width:1160px; margin:0 auto;
  display:flex; align-items:stretch;
  flex-wrap:wrap;
}
.trust-item {
  display:flex; align-items:center; gap:12px;
  padding:20px 28px;
  flex:1; min-width:150px;
  border-right:1px solid rgba(255,255,255,0.06);
  transition:background var(--dur-fast) ease;
}
.trust-item:last-child { border-right:none; }
.trust-item:hover { background:rgba(245,166,35,0.04); }
.trust-icon { font-size:20px; opacity:.8; }
.trust-value {
  font-family:var(--font-display); font-size:18px; font-weight:900;
  color:var(--brand-yellow); line-height:1; white-space:nowrap;
}
.trust-label {
  font-size:11px; color:var(--text-on-dark-muted);
  line-height:1.3; text-transform:uppercase; letter-spacing:.04em;
}

/* ══════════════════════════════════════════════
   SECTIONS
══════════════════════════════════════════════ */
.section { padding:80px 24px; }
.section-light   { background:var(--neutral-white); }
.section-neutral { background:var(--neutral-light); }
.section-dark    { background:var(--gradient-dark-section); }
.section-yellow  { background:var(--brand-yellow); }

/* ══════════════════════════════════════════════
   SECTION TITLE
══════════════════════════════════════════════ */
.section-title-block { margin-bottom:36px; }
.section-title-block.center { text-align:center; }
.section-title-block.center .section-subtitle { margin:0 auto; }
.section-heading {
  font-family:var(--font-display); font-size:var(--text-section);
  font-weight:800; text-transform:uppercase;
  letter-spacing:-0.01em; line-height:var(--lh-impact);
  margin-bottom:12px;
}
.section-heading.dark  { color:var(--brand-black); }

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

/* ──────────────────────────────────────────
   SCROLL-REVEAL HOOK
────────────────────────────────────────── */
function useScrollReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const obs = new IntersectionObserver(
      (entries) => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } }),
      { threshold: 0.12 }
    );
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

/* ──────────────────────────────────────────
   COUNTER ANIMATION
────────────────────────────────────────── */
function useCountUp(target, duration = 1500) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      obs.disconnect();
      const num = parseFloat(target.replace(/[^0-9.]/g,''));
      if (isNaN(num)) return;
      let start = null;
      const step = (ts) => {
        if (!start) start = ts;
        const progress = Math.min((ts - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        setVal(Math.floor(eased * num));
        if (progress < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, { threshold: 0.5 });
    obs.observe(el);
    return () => obs.disconnect();
  }, [target, duration]);
  return [val, ref];
}

/* ──────────────────────────────────────────
   COMPONENTS
────────────────────────────────────────── */

function CTAButton({ variant = 'primary', size = '', fullWidth, onClick, type = 'button', href, children }) {
  const cls = ['btn', `btn-${variant}`, size ? `btn-${size}` : '', fullWidth ? 'btn-full' : ''].filter(Boolean).join(' ');
  if (href) return <a className={cls} href={href} target="_blank" rel="noopener">{children}</a>;
  return <button className={cls} onClick={onClick} type={type}>{children}</button>;
}

function Card({ icon, title, description, variant = 'light' }) {
  return (
    <div className={`card card-${variant}`}>
      <div className="card-icon">{icon}</div>
      <div className="card-title">{title}</div>
      <div className="card-desc">{description}</div>
    </div>
  );
}

function MetricBadge({ value, label, theme = 'dark', size = 'normal' }) {
  return (
    <div className="metric-badge">
      <div className={`metric-value ${size}`}>{value}</div>
      <div className={`metric-label ${theme}`}>{label}</div>
    </div>
  );
}

function FAQItem({ question, answer }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={`faq-item${open ? ' open' : ''}`}>
      <button className="faq-trigger" onClick={() => setOpen(o => !o)} aria-expanded={open}>
        <span className="faq-question">{question}</span>
        <span className="faq-chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <div className={`faq-body${open ? ' open' : ''}`}>
        <p className="faq-answer">{answer}</p>
      </div>
    </div>
  );
}

function SectionTitle({ children, subtitle, variant = 'default', align = 'left' }) {
  const c = variant === 'light' ? 'light' : 'dark';
  return (
    <div className={`section-title-block ${align}`}>
      <h2 className={`section-heading ${c}`}>{children}</h2>
      {subtitle && <p className={`section-subtitle ${c}`}>{subtitle}</p>}
    </div>
  );
}

function TrustBar({ items }) {
  return (
    <div className="trust-bar">
      <div className="trust-bar-inner">
        {items.map((item, i) => (
          <div key={i} className="trust-item">
            <div className="trust-icon">{item.icon}</div>
            <div>
              <div className="trust-value">{item.value}</div>
              <div className="trust-label">{item.label}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProcessStep({ number, title, description }) {
  return (
    <div className="process-step">
      <div className="step-circle">{number}</div>
      <div className="step-title">{title}</div>
      <div className="step-desc">{description}</div>
    </div>
  );
}

function ComparisonTable({ rows }) {
  return (
    <div className="comp-wrap">
      <div className="comp-header">
        <div className="comp-header-cell">Critério</div>
        <div className="comp-header-cell">Concorrentes</div>
        <div className="comp-header-cell cf-col">✦ CheckFast</div>
