<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheckFast — Franquia de Vistoria Veicular</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<style>
/* ─────────────────────────────────────────────
   DESIGN TOKENS
───────────────────────────────────────────── */
:root {
  /* Colors – Brand */
  --brand-yellow:       #F5A623;
  --brand-yellow-hover: #E09000;
  --brand-yellow-light: #FFF8E7;
  --brand-yellow-muted: #FFF3D6;
  --brand-black:        #1A1A1A;
  --brand-dark-gray:    #2D2D2D;

  /* Colors – Neutral */
  --neutral-white:  #FFFFFF;
  --neutral-light:  #F5F5F5;
  --neutral-med:    #4A4A4A;
  --neutral-border: #EEEEEE;

  /* Colors – Semantic */
  --text-on-dark:           rgba(255,255,255,0.85);
  --text-on-dark-secondary: rgba(255,255,255,0.70);
  --text-on-dark-muted:     rgba(255,255,255,0.50);
  --text-on-dark-faint:     rgba(255,255,255,0.35);
  --yellow-glass:           rgba(245,166,35,0.12);
  --yellow-border:          rgba(245,166,35,0.20);
  --yellow-glow:            rgba(245,166,35,0.08);

  /* Gradients */
  --gradient-hero:         linear-gradient(135deg,#1A1A1A 0%,#0d0d0d 100%);
  --gradient-dark-section: linear-gradient(135deg,#1A1A1A 0%,#0d0d0d 50%,#2D2D2D 100%);

  /* Typography */
  --font-display: 'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:    'DM Sans','Segoe UI',system-ui,sans-serif;

  --text-hero:       clamp(2rem,4.5vw,3.2rem);
  --text-section:    clamp(1.75rem,4vw,2.5rem);
  --text-impact:     clamp(1.3rem,3vw,1.8rem);
  --text-card-title: 17px;
  --text-metric:     clamp(1.5rem,3vw,2.2rem);
  --text-metric-lg:  clamp(2.5rem,5vw,3.5rem);

  --lh-headline: 1.10;
  --lh-impact:   1.15;
  --lh-body:     1.55;
  --lh-body-lg:  1.60;
  --ls-headline: -0.02em;
  --ls-badge:     0.05em;

  /* Spacing */
  --space-wrap-max: 1160px;

  /* Borders */
  --radius-sm:     4px;
  --radius-card:   12px;
  --radius-button: 8px;
  --radius-input:  8px;
  --radius-badge:  100px;
  --radius-circle: 50%;
  --radius-lg:     16px;

  /* Shadows */
  --shadow-card:            0 2px 8px rgba(0,0,0,0.06);
  --shadow-card-hover:      0 12px 32px rgba(0,0,0,0.12);
  --shadow-card-dark:       0 2px 8px rgba(0,0,0,0.20);
  --shadow-card-dark-hover: 0 12px 32px rgba(0,0,0,0.40);
  --shadow-table:           0 4px 20px rgba(0,0,0,0.08);
  --shadow-button:          0 4px 16px rgba(245,166,35,0.30);

  /* Motion */
  --dur-fast:   0.25s;
  --dur-normal: 0.30s;
  --dur-slow:   0.40s;
  --dur-enter:  0.70s;
}

/* ─────────────────────────────────────────────
   RESET + BASE
───────────────────────────────────────────── */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body { background:var(--brand-black); font-family:var(--font-body); color:var(--neutral-white); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; }
input,select,button { font-family:inherit; outline:none; }
input::placeholder { color:rgba(255,255,255,0.45); }
select option { background:var(--brand-black); color:#fff; }
::selection { background:var(--brand-yellow); color:var(--brand-black); }
img { display:block; max-width:100%; }

/* ─────────────────────────────────────────────
   ANIMATIONS
───────────────────────────────────────────── */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(24px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
.animate-fade-up {
  opacity:0;
  animation:fadeUp var(--dur-enter) ease forwards;
}

/* ─────────────────────────────────────────────
   SHARED LAYOUT
───────────────────────────────────────────── */
.wrap {
  max-width:var(--space-wrap-max);
  margin:0 auto;
  padding:0 24px;
}

/* ─────────────────────────────────────────────
   CTA BUTTON
───────────────────────────────────────────── */
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:16px 36px;
  font-family:var(--font-display);
  font-size:16px;
  font-weight:700;
  letter-spacing:var(--ls-badge);
  text-transform:uppercase;
  border-radius:var(--radius-button);
  border:2px solid transparent;
  cursor:pointer;
  min-height:48px;
  transition:background var(--dur-fast) ease,
             color var(--dur-fast) ease,
             border-color var(--dur-fast) ease,
             transform 0.1s ease,
             box-shadow var(--dur-fast) ease;
  white-space:nowrap;
}
.btn:active { transform:scale(0.98); }
.btn:focus-visible { outline:2px solid var(--brand-yellow); outline-offset:3px; }

.btn-primary {
  background:var(--brand-yellow);
  color:var(--brand-black);
  border-color:var(--brand-yellow);
  box-shadow:var(--shadow-button);
}
.btn-primary:hover {
  background:var(--brand-yellow-hover);
  border-color:var(--brand-yellow-hover);
}

.btn-secondary {
  background:transparent;
  color:var(--brand-yellow);
  border-color:var(--brand-yellow);
}
.btn-secondary:hover {
  background:var(--brand-yellow);
  color:var(--brand-black);
}

.btn-inverted {
  background:var(--brand-black);
  color:var(--brand-yellow);
  border-color:var(--brand-black);
}
.btn-inverted:hover {
  background:#111;
}

.btn-sm {
  padding:10px 22px;
  font-size:13px;
  min-height:38px;
}

.btn-full { width:100%; }

/* ─────────────────────────────────────────────
   CARD
───────────────────────────────────────────── */
.card {
  border-radius:var(--radius-card);
  padding:28px 24px;
  border-left:4px solid transparent;
  transition:box-shadow var(--dur-normal) ease,
             transform var(--dur-normal) ease,
             border-color var(--dur-normal) ease;
  position:relative;
}
.card:hover {
  transform:translateY(-4px);
  border-left-color:var(--brand-yellow);
}
.card-light {
  background:var(--neutral-white);
  border:1px solid var(--neutral-border);
  border-left:4px solid transparent;
  box-shadow:var(--shadow-card);
}
.card-light:hover { box-shadow:var(--shadow-card-hover); border-left-color:var(--brand-yellow); }
.card-dark {
  background:var(--brand-dark-gray);
  border:1px solid rgba(245,166,35,0.15);
  border-left:4px solid transparent;
  box-shadow:var(--shadow-card-dark);
}
.card-dark:hover { box-shadow:var(--shadow-card-dark-hover); border-left-color:var(--brand-yellow); }

.card-icon { font-size:28px; margin-bottom:12px; line-height:1; }
.card-title {
  font-family:var(--font-display);
  font-size:var(--text-card-title);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:-0.01em;
  margin-bottom:8px;
}
.card-light .card-title { color:var(--brand-black); }
.card-dark .card-title  { color:var(--brand-yellow); }
.card-desc {
  font-size:14px;
  font-weight:500;
  line-height:1.55;
}
.card-light .card-desc { color:var(--neutral-med); }
.card-dark .card-desc  { color:var(--text-on-dark-secondary); }

/* ─────────────────────────────────────────────
   SECTION TITLE
───────────────────────────────────────────── */
.section-title-block { margin-bottom:32px; }
.section-title-block.center { text-align:center; }
.section-title-block.center .section-subtitle { margin:0 auto; }

.section-heading {
  font-family:var(--font-display);
  font-size:var(--text-section);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:var(--ls-headline);
  line-height:var(--lh-impact);
  margin-bottom:12px;
}
.section-heading.dark { color:var(--brand-black); }
.section-heading.light { color:var(--neutral-white); }

.section-subtitle {
  font-size:16px;
  line-height:1.55;
  max-width:680px;
}
.section-subtitle.dark { color:var(--neutral-med); }
.section-subtitle.light { color:var(--text-on-dark-secondary); }

/* ─────────────────────────────────────────────
   METRIC BADGE
───────────────────────────────────────────── */
.metric-badge {
  padding:16px 12px;
  text-align:center;
  flex:1;
}
.metric-value {
  font-family:var(--font-display);
  font-weight:900;
  color:var(--brand-yellow);
  line-height:1;
}
.metric-value.normal { font-size:var(--text-metric); }
.metric-value.lg     { font-size:var(--text-metric-lg); }
.metric-label {
  font-size:13px;
  font-weight:600;
  letter-spacing:0.03em;
  text-transform:uppercase;
  margin-top:4px;
}
.metric-label.dark  { color:var(--text-on-dark-muted); }
.metric-label.light { color:var(--neutral-med); }

/* ─────────────────────────────────────────────
   FAQ ITEM
───────────────────────────────────────────── */
.faq-item {
  border-bottom:1px solid #e5e5e5;
  padding:20px 0;
}
.faq-trigger {
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
  text-align:left;
}
.faq-question {
  font-size:16px;
  font-weight:700;
  color:var(--brand-black);
  line-height:1.4;
}
.faq-icon {
  font-size:22px;
  font-weight:700;
  color:var(--brand-yellow);
  transition:transform var(--dur-slow) ease;
  flex-shrink:0;
  user-select:none;
  line-height:1;
}
.faq-icon.open { transform:rotate(45deg); }
.faq-answer {
  overflow:hidden;
  max-height:0;
  transition:max-height var(--dur-slow) ease, padding-top var(--dur-slow) ease;
}
.faq-answer.open {
  max-height:300px;
  padding-top:12px;
}
.faq-answer p {
  font-size:15px;
  color:var(--neutral-med);
  line-height:1.6;
  padding-right:40px;
}

/* ─────────────────────────────────────────────
   TRUST BAR
───────────────────────────────────────────── */
.trust-bar {
  background:#111111;
  border-top:2px solid rgba(245,166,35,0.3);
  border-bottom:2px solid rgba(245,166,35,0.3);
  padding:20px 24px;
}
.trust-bar-inner {
  max-width:var(--space-wrap-max);
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.trust-item {
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:130px;
}
.trust-value {
  font-family:var(--font-display);
  font-size:18px;
  font-weight:900;
  color:var(--brand-yellow);
  line-height:1;
  white-space:nowrap;
}
.trust-label {
  font-size:11px;
  color:var(--text-on-dark-muted);
  line-height:1.3;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.trust-divider {
  width:1px;
  height:32px;
  background:rgba(255,255,255,0.12);
}

/* ─────────────────────────────────────────────
   PROCESS STEP
───────────────────────────────────────────── */
.process-step { text-align:center; }
.step-circle {
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--brand-black);
  border:2px solid var(--brand-black);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  font-family:var(--font-display);
  font-size:22px;
  font-weight:900;
  color:var(--brand-yellow);
}
.step-title {
  font-family:var(--font-display);
  font-size:16px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--brand-black);
  margin-bottom:4px;
}
.step-desc {
  font-size:13px;
  color:rgba(0,0,0,0.55);
  line-height:1.5;
}

/* ─────────────────────────────────────────────
   COMPARISON TABLE
───────────────────────────────────────────── */
.comp-table {
  border-radius:var(--radius-card);
  overflow:hidden;
  box-shadow:var(--shadow-table);
  border:1px solid var(--neutral-border);
}
.comp-header {
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  background:var(--brand-black);
  color:var(--neutral-white);
}
.comp-header-cell {
  padding:16px 20px;
  font-family:var(--font-display);
  font-size:14px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.05em;
}
.comp-header-cell.highlight { color:var(--brand-yellow); }
.comp-row {
  display:grid;
  grid-template-columns:1.5fr 1fr 1fr;
  border-bottom:1px solid var(--neutral-border);
}
.comp-row:last-child { border-bottom:none; }
.comp-row:nth-child(even) { background:var(--brand-yellow-muted); }
.comp-row:nth-child(odd)  { background:var(--neutral-white); }
.comp-cell {
  padding:14px 20px;
  font-size:14px;
  color:var(--neutral-med);
  line-height:1.4;
  display:flex;
  align-items:center;
}
.comp-cell.criteria {
  font-weight:600;
  color:var(--brand-black);
}
.comp-cell.highlight {
  font-weight:700;
  color:var(--brand-black);
}

/* ─────────────────────────────────────────────
   CHECK BULLET
───────────────────────────────────────────── */
.check-bullet {
  display:flex;
  align-items:center;
  gap:10px;
}
.check-circle {
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--brand-yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:700;
  color:var(--brand-black);
  flex-shrink:0;
}
.check-text {
  font-size:15px;
  font-weight:500;
  color:var(--text-on-dark);
}

/* ─────────────────────────────────────────────
   FORM STYLES
───────────────────────────────────────────── */
.form-label {
  display:block;
  font-size:11px;
  color:var(--text-on-dark-muted);
  text-transform:uppercase;
  letter-spacing:0.05em;
  margin-bottom:5px;
}
.form-input {
  width:100%;
  padding:13px 16px;
  font-size:15px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:var(--radius-input);
  color:#fff;
  transition:border-color var(--dur-fast) ease;
}
.form-input:focus { border-color:var(--brand-yellow); }

/* ─────────────────────────────────────────────
   NAV
───────────────────────────────────────────── */
.navbar {
  position:absolute;
  top:0; left:0; right:0;
  z-index:10;
}
.navbar-inner {
  max-width:var(--space-wrap-max);
  margin:0 auto;
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo {
  font-family:var(--font-display);
  font-size:22px;
  font-weight:900;
  color:var(--neutral-white);
  text-transform:uppercase;
  letter-spacing:-0.01em;
}
.logo span { color:var(--brand-yellow); }

/* ─────────────────────────────────────────────
   HERO SECTION
───────────────────────────────────────────── */
.hero {
  background:var(--gradient-hero);
  min-height:100vh;
  padding:130px 24px 80px;
  position:relative;
  overflow:hidden;
}
.hero-deco {
  position:absolute;
  border-radius:50%;
  border:2px solid var(--yellow-glow);
  pointer-events:none;
}
.hero-grid {
  max-width:var(--space-wrap-max);
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr 420px;
  gap:56px;
  align-items:center;
}
.hero-badge {
  display:inline-flex;
  align-items:center;
  background:var(--yellow-glass);
  border:1px solid var(--yellow-border);
  border-radius:var(--radius-badge);
  padding:5px 14px;
  margin-bottom:20px;
}
.hero-badge span {
  font-family:var(--font-display);
  font-size:13px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  color:var(--brand-yellow);
}
.hero-h1 {
  font-family:var(--font-display);
  font-size:var(--text-hero);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:var(--ls-headline);
  line-height:var(--lh-headline);
  color:var(--neutral-white);
  margin-bottom:18px;
}
.hero-h1 span { color:var(--brand-yellow); }
.hero-p {
  font-size:17px;
  color:var(--text-on-dark-secondary);
  line-height:var(--lh-body-lg);
  margin-bottom:28px;
  max-width:500px;
}
.hero-bullets {
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:32px;
}
.form-card {
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(10px);
  border:1px solid var(--yellow-border);
  border-radius:var(--radius-lg);
  padding:28px;
}
.form-card h2 {
  font-family:var(--font-display);
  font-size:20px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--neutral-white);
  letter-spacing:-0.01em;
  margin-bottom:6px;
}
.form-card p.sub {
  font-size:12px;
  color:var(--text-on-dark-muted);
  margin-bottom:18px;
}
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-stack { display:flex; flex-direction:column; gap:12px; }
.form-disclaimer {
  font-size:11px;
  color:var(--text-on-dark-faint);
  text-align:center;
  margin-top:4px;
}
.submitted-msg { text-align:center; padding:24px 0; }
.submitted-msg .emoji { font-size:44px; margin-bottom:14px; }
.submitted-msg h3 {
  font-family:var(--font-display);
  font-size:22px;
  font-weight:800;
  text-transform:uppercase;
  color:var(--brand-yellow);
  margin-bottom:10px;
}
.submitted-msg p {
  font-size:15px;
  color:var(--text-on-dark-secondary);
  line-height:1.6;
}

/* ─────────────────────────────────────────────
   SECTIONS — GENERIC
───────────────────────────────────────────── */
.section { padding:80px 24px; }
.section-light { background:var(--neutral-white); }
.section-neutral { background:var(--neutral-light); }
.section-dark { background:var(--gradient-dark-section); }
.section-yellow { background:var(--brand-yellow); }

/* ─────────────────────────────────────────────
   AUTHORITY
───────────────────────────────────────────── */
.authority-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px;
  align-items:center;
}
.metrics-row { display:flex; }
.authority-body p {
  font-size:16px;
  color:var(--neutral-med);
  line-height:1.6;
  margin-bottom:14px;
}
.authority-body p:last-child { margin-bottom:0; }

/* ─────────────────────────────────────────────
   STATS GRID
───────────────────────────────────────────── */
.stats-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.stat-card {
  background:var(--neutral-white);
  border-radius:var(--radius-card);
  padding:24px 16px;
  text-align:center;
  box-shadow:var(--shadow-card);
}
.stat-value {
  font-family:var(--font-display);
  font-size:var(--text-metric);
  font-weight:900;
  color:var(--brand-yellow);
  line-height:1;
}
.stat-label {
  font-size:13px;
  color:var(--neutral-med);
  margin-top:6px;
}

/* ─────────────────────────────────────────────
   POSITIONING SECTION
───────────────────────────────────────────── */
.positioning-title {
  font-family:var(--font-display);
  font-size:var(--text-section);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:var(--ls-headline);
  color:var(--neutral-white);
  line-height:var(--lh-impact);
  margin-bottom:20px;
}
.positioning-title span { color:var(--brand-yellow); }

/* ─────────────────────────────────────────────
   MODELS SECTION
───────────────────────────────────────────── */
.models-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.model-card {
  background:var(--brand-dark-gray);
  border-radius:var(--radius-card);
  border:1px solid rgba(245,166,35,0.2);
  padding:28px;
}
.model-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}
.model-name {
  font-family:var(--font-display);
  font-size:22px;
  font-weight:900;
  text-transform:uppercase;
  color:var(--neutral-white);
}
.model-badge {
  font-family:var(--font-display);
  font-size:11px;
  font-weight:700;
  letter-spacing:0.05em;
  text-transform:uppercase;
  background:var(--brand-yellow);

<script type="text/babel">
const { useState, useRef } = React;

/* ──────────────────────────────────────────
   COMPONENT LIBRARY
────────────────────────────────────────── */

function CTAButton({ variant = 'primary', size = 'md', fullWidth, onClick, type = 'button', children }) {
  const cls = [
    'btn',
    `btn-${variant}`,
    size === 'sm' ? 'btn-sm' : '',
    fullWidth ? 'btn-full' : '',
  ].filter(Boolean).join(' ');
  return (
    <button className={cls} onClick={onClick} type={type}>
      {children}
    </button>
  );
}

function Card({ icon, title, description, variant = 'light' }) {
  return (
    <div className={`card card-${variant}`}>
      <div className="card-icon">{icon}</div>
      <div className="card-title">{title}</div>
      <div className="card-desc">{description}</div>
    </div>
  );
}

function MetricBadge({ value, label, theme = 'dark', size = 'normal' }) {
  return (
    <div className="metric-badge">
      <div className={`metric-value ${size}`}>{value}</div>
      <div className={`metric-label ${theme}`}>{label}</div>
    </div>
  );
}

function FAQItem({ question, answer }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="faq-item">
      <button className="faq-trigger" onClick={() => setOpen(!open)} aria-expanded={open}>
        <span className="faq-question">{question}</span>
        <span className={`faq-icon${open ? ' open' : ''}`}>+</span>
      </button>
      <div className={`faq-answer${open ? ' open' : ''}`}>
        <p>{answer}</p>
      </div>
    </div>
  );
}

function SectionTitle({ children, subtitle, variant = 'default', align = 'left' }) {
  const colorClass = variant === 'light' ? 'light' : 'dark';
  return (
    <div className={`section-title-block ${align}`}>
      <h2 className={`section-heading ${colorClass}`}>{children}</h2>
      {subtitle && <p className={`section-subtitle ${colorClass}`}>{subtitle}</p>}
    </div>
  );
}

function TrustBar({ items }) {
  return (
    <div className="trust-bar">
      <div className="trust-bar-inner">
        {items.map((item, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div className="trust-divider" />}
            <div className="trust-item">
              <div>
                <div className="trust-value">{item.value}</div>
                <div className="trust-label">{item.label}</div>
              </div>
            </div>
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function ProcessStep({ number, title, description }) {
  return (
    <div className="process-step">
      <div className="step-circle">{number}</div>
      <div className="step-title">{title}</div>
      <div className="step-desc">{description}</div>
    </div>
  );
}

function ComparisonTable({ rows }) {
  return (
    <div className="comp-table">
      <div className="comp-header">
        <div className="comp-header-cell">Critério</div>
        <div className="comp-header-cell">Franquias Tradicionais</div>
        <div className="comp-header-cell highlight">CheckFast</div>
      </div>
      {rows.map((row, i) => (
        <div className="comp-row" key={i}>
          <div className="comp-cell criteria">{row.criteria}</div>
          <div className="comp-cell">{row.competitor}</div>
          <div className="comp-cell highlight">{row.checkfast}</div>
        </div>
      ))}
    </div>
  );
}

function Wrap({ children, style }) {
  return <div className="wrap" style={style}>{children}</div>;
}

function CheckBullet({ text }) {
  return (
    <div className="check-bullet">
      <div className="check-circle">✓</div>
      <span className="check-text">{text}</span>
    </div>
  );
}

          <CTAButton variant="primary" onClick={() => {

        <div ref={formRef} className="form-card">

              <h3>CADASTRO ENVIADO</h3>

            <>

                    <input className="form-input" name="cidade" value={form.cidade} onChange={ch} placeholder="Sua cidade" required />
                  </div>
                  <div>
                    <label className="form-label">Capital disponível</label>
                    <select className="form-input" name="capital" value={form.capital} onChange={ch} style={{cursor:'pointer'}} required>
                      <option value="">Selecione</option>
                      <option value="ate50">Até R$ 50mil</option>
                      <option value="50-80">R$ 50–80mil</option>
                      <option value="80-120">R$ 80–120mil</option>
                      <option value="120+">Acima de R$ 120mil</option>
                    </select>
                  </div>
                </div>
                <CTAButton variant="primary" fullWidth type="submit">
                  {loading ? 'ENVIANDO...' : 'RECEBER APRESENTAÇÃO'}
                </CTAButton>
                <p className="form-disclaimer">Sem compromisso. Dados não compartilhados.</p>
              </form>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

function App() {

  const scrollToForm = () => {
    if (formRef.current) {

      window.scrollTo({ top, behavior:'smooth' });
    }
  };

  return (
    <div>
      <div style={{position:'relative'}}>
        <NavBar scrollToForm={scrollToForm} />
        <HeroSection formRef={formRef} />

      <TrustBar items={[

        { value:'R$ 57mil',    label:'Investimento inicial'   },
